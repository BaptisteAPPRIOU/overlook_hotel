<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      name="description"
      content="Create an Overlookhostel client account to book rooms and manage reservations."
    />
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/authPage.css(v='auth-ui-6')}" />
    <script defer th:src="@{/js/register.js(v='auth-ui-6')}"></script>
  </head>
  <body>
    <div class="main-card">
      <img
        alt="Overlookhostel"
        class="logo"
        width="90"
        decoding="async"
        fetchpriority="high"
        th:src="@{/image/logo_noBg_no_name.webp(v='transparent-1')}"
      />
      <h1>Create Account</h1>

      <form id="registerForm">
        <input
          id="firstName"
          name="firstName"
          placeholder="First Name"
          required
          type="text"
        />
        <input
          id="lastName"
          name="lastName"
          placeholder="Last Name"
          required
          type="text"
        />

        <div class="email-wrapper">
          <input id="emailPrefix" placeholder="Email" required type="text" />
          <div class="email-suffix">@olh.fr</div>
        </div>
        <input id="email" name="email" type="hidden" />
        <input
          id="password"
          name="password"
          placeholder="Password"
          required
          type="password"
        />
        <button type="submit">Register</button>
      </form>

      <div
        aria-live="polite"
        class="form-message"
        id="message"
        role="alert"
      ></div>
    </div>
  </body>
</html>
