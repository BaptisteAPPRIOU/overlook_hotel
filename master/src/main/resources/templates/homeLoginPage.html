<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      name="description"
      content="Choose your Overlookhostel access space to sign in as a client or employee, or create a new account."
    />
    <title>OverLookHostel</title>
    <link rel="stylesheet" th:href="@{/css/homeLoginPage.css(v='auth-bg-5')}" />
  </head>
  <body>
    <div class="main-card">
      <img
        alt="OverLookHostel Logo"
        class="main-logo"
        width="313"
        height="96"
        decoding="async"
        fetchpriority="high"
        th:src="@{/image/logo_noBg.webp}"
      />

      <div class="card-container">
        <a class="card" th:href="@{/clientLogin}">
          <img
            alt=""
            aria-hidden="true"
            width="128"
            height="128"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
            th:src="@{/image/Client_logo.webp}"
          />
          <h3>Client</h3>
        </a>

        <a class="card" th:href="@{/employeeLogin}">
          <img
            alt=""
            aria-hidden="true"
            width="128"
            height="128"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
            th:src="@{/image/Employee_logo.webp}"
          />
          <h3>Employee</h3>
        </a>

        <a class="card" th:href="@{/register}">
          <img
            alt=""
            aria-hidden="true"
            width="128"
            height="128"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
            th:src="@{/image/Register_logo.webp}"
          />
          <h3>Register</h3>
        </a>
      </div>
    </div>
  </body>
</html>
