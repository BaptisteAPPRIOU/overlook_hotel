<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Overlookhostel employee planning page for weekly work schedule consultation."
    />
    <title th:text="${title}">My Work Schedule</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-4">
      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
      >
        <div>
          <h1 class="h3 mb-1">My Work Schedule</h1>
          <p
            class="text-muted mb-0"
            th:text="${currentUser.firstName + ' ' + currentUser.lastName}"
          >
            Employee
          </p>
        </div>
        <a class="btn btn-outline-secondary" href="/employeeDashboard">
          Back to dashboard
        </a>
      </div>

      <div th:if="${error}" class="alert alert-warning" th:text="${error}">
        Planning unavailable
      </div>

      <section th:if="${planning != null}" class="card">
        <div class="card-header d-flex justify-content-between">
          <span th:text="${planning.employeeName}">Employee</span>
          <span th:text="${planning.weeklyHours + ' h/week'}">0 h/week</span>
        </div>
        <div class="table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">Day</th>
                <th scope="col">Hours</th>
                <th scope="col">Shift</th>
                <th scope="col">Service</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="day : ${planning.workDays}">
                <td th:text="${day.dayName}">MONDAY</td>
                <td
                  th:text="${day.isWorking ? day.startTime + ' - ' + day.endTime : '-'}"
                >
                  -
                </td>
                <td th:text="${day.shiftType != null ? day.shiftType : '-'}">
                  -
                </td>
                <td th:text="${day.service != null ? day.service : '-'}">-</td>
                <td>
                  <span
                    class="badge"
                    th:classappend="${day.isWorking ? 'bg-success' : 'bg-secondary'}"
                    th:text="${day.isWorking ? 'Planned' : 'Off'}"
                  >
                    Off
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
