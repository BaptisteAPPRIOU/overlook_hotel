<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.3/dist/cdn.min.js"></script>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      name="description"
      content="Overlookhostel admin dashboard for employee, planning, room and leave approval management."
    />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/employeeDashboard.css(v='staff-css-20260717-4')}" />
    <link rel="stylesheet" th:href="@{/css/employeeRooms.css(v='dashboard-ui-2')}" />
    <link rel="stylesheet" th:href="@{/css/employeeLeaveRequest.css}" />
    <link rel="stylesheet" th:href="@{/css/employeeWorkSchedule.css}" />
    <link rel="stylesheet" th:href="@{/css/employeeRoomReviews.css}" />
    <link rel="stylesheet" th:href="@{/css/employeeSettings.css(v='dashboard-ui-2')}" />
    <link rel="stylesheet" th:href="@{/css/employeeLeaveApproval.css}" />
    <link rel="stylesheet" th:href="@{/css/employeeManagement.css}" />
    <link rel="stylesheet" th:href="@{/css/employeePlanningManagement.css}" />
  </head>
  <body>
    <div id="notificationContainer" class="position-fixed" style="top: 20px; right: 20px; z-index: 9999"></div>

    <div class="container-fluid">
      <div class="row">
        <div th:replace="~{fragments/staff/sidebar :: staffSidebar('admin')}"></div>

        <main class="col-md-10 content">
          <div th:replace="~{fragments/staff/header :: staffHeader}"></div>
          <div th:replace="~{fragments/staff/roomManagement :: roomManagementSection}"></div>
          <div th:replace="~{fragments/staff/leaveRequest :: leaveRequestSection}"></div>
          <div th:replace="~{fragments/staff/workSchedule :: workScheduleSection}"></div>
          <div th:replace="~{fragments/staff/planningManagement :: planningManagementSection}"></div>
          <div th:replace="~{fragments/staff/roomReviews :: roomReviewsSection}"></div>
          <div th:replace="~{fragments/staff/employeeManagement :: employeeManagementSection}"></div>
          <div th:replace="~{fragments/staff/settings :: settingsSection}"></div>
          <div th:replace="~{fragments/staff/leaveApproval :: leaveApprovalSection}"></div>
        </main>
      </div>
    </div>

    <div th:replace="~{fragments/modals/addShiftModal :: addShiftModal}"></div>
    <div th:replace="~{fragments/modals/editShiftModal :: editShiftModal}"></div>

    <script th:src="@{/js/employeeDashboard.js(v='staff-20260717-6')}"></script>
    <script th:src="@{/js/employeeRooms.js(v='dashboard-ui-2')}"></script>
    <script th:src="@{/js/employeePlanning.js(v='staff-20260717-6')}"></script>
    <script th:src="@{/js/leaveRequests.js(v='staff-20260717-6')}"></script>
    <script th:src="@{/js/employeeWorkSchedule.js(v='staff-20260717-6')}"></script>
    <script th:src="@{/js/employeeRoomReviews.js(v='staff-20260717-6')}"></script>
    <script th:src="@{/js/employeeSettings.js(v='staff-20260717-6')}"></script>
    <script th:src="@{/js/employeeManagement.js(v='staff-20260717-6')}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
