<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <body>
    <section
      th:fragment="roomManagementSection"
      class="dashboard-panel reservations-panel"
      id="reservations"
      data-dashboard-section>
      <div class="reservations-page">
        <h1>Rooms Management</h1>
        <div
          class="reservations-list"
          id="reservationsContainer"
          aria-live="polite">
          <div class="reservations-empty">Loading reservations...</div>
        </div>
      </div>

      <div
        class="reservation-modal"
        id="deleteReservationModal"
        aria-hidden="true">
        <div class="reservation-modal-backdrop" data-reservation-modal-close></div>
        <section
          class="reservation-modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="deleteReservationTitle">
          <img
            class="reservation-modal-logo"
            th:src="@{/image/logo_noBg.webp}"
            alt="Overlookhostel"
            width="246"
            height="68"
          />
          <div class="reservation-delete-message" id="deleteReservationTitle">
            Delete this reservation?
          </div>
          <div class="reservation-modal-actions">
            <button
              class="reservation-modal-button light"
              type="button"
              data-reservation-modal-close>
              Cancel
            </button>
            <button
              class="reservation-modal-button gold"
              type="button"
              id="confirmDeleteReservation">
              Delete
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                <path d="M3 6h18"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </section>
      </div>

      <div
        class="reservation-modal"
        id="feedbackReservationModal"
        aria-hidden="true">
        <div class="reservation-modal-backdrop" data-reservation-modal-close></div>
        <section
          class="reservation-modal-card feedback"
          role="dialog"
          aria-modal="true"
          aria-labelledby="feedbackReservationTitle">
          <img
            class="reservation-modal-logo"
            th:src="@{/image/logo_noBg.webp}"
            alt="Overlookhostel"
            width="246"
            height="68"
          />

          <div class="reservation-feedback-body">
            <div class="reservation-reviewer">
              <div class="reservation-reviewer-avatar" id="feedbackReviewerAvatar">
                JD
              </div>
              <div class="rating-stars compact" aria-hidden="true">
                <span class="filled"></span>
                <span class="filled"></span>
                <span class="filled"></span>
                <span class="filled"></span>
                <span class="filled"></span>
              </div>
            </div>
            <label class="reservation-feedback-field" for="feedbackReservationText">
              <span class="sr-only" id="feedbackReservationTitle">
                Reservation feedback
              </span>
              <textarea
                id="feedbackReservationText"
                rows="3"
                maxlength="220"
                placeholder="Share your feedback"></textarea>
            </label>
          </div>

          <div class="reservation-modal-actions split">
            <button
              class="reservation-modal-button gold"
              type="button"
              id="sendReservationFeedback">
              Send
            </button>
            <button
              class="reservation-modal-button light"
              type="button"
              data-reservation-modal-close>
              Cancel
            </button>
          </div>
        </section>
      </div>
    </section>
  </body>
</html>
