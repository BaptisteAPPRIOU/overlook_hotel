<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      name="description"
      content="Client login page for Overlookhostel room reservations and loyalty program access."
    />
    <title>Client Login</title>
    <link rel="stylesheet" th:href="@{/css/authPage.css(v='auth-ui-6')}" />
    <script defer th:src="@{/js/clientLogin.js(v='auth-ui-6')}"></script>
  </head>
  <body>
    <div class="main-card">
      <img
        alt="Overlookhostel"
        class="logo"
        width="90"
        decoding="async"
        fetchpriority="high"
        th:src="@{/image/logo_noBg_no_name.webp(v='transparent-1')}"
      />
      <h1>Client Login</h1>

      <form id="clientLoginForm">
        <input
          id="email"
          name="email"
          placeholder="Email"
          required
          type="email"
        />
        <input
          id="password"
          name="password"
          placeholder="Password"
          required
          type="password"
        />
        <button type="submit">Login</button>
      </form>

      <div
        aria-live="polite"
        class="form-message"
        id="message"
        role="alert"
      ></div>
    </div>
  </body>
</html>
