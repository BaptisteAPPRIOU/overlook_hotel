<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      name="description"
      content="Client login page for Overlookhostel room reservations and loyalty program access."
    />
    <title>Client Login</title>
    <link rel="stylesheet" th:href="@{/css/authPage.css(v='auth-bg-5')}" />
    <script defer th:src="@{/js/clientLogin.js}"></script>
  </head>
  <body>
    <div class="main-card">
      <img
        alt="Overlookhostel"
        class="logo"
        width="120"
        decoding="async"
        fetchpriority="high"
        th:src="@{/image/logo_noBg_no_name.webp}"
      />
      <h1>Client Login</h1>

      <form id="clientLoginForm">
        <input
          id="email"
          name="email"
          placeholder="Email"
          required
          type="email"
        />
        <input
          id="password"
          name="password"
          placeholder="Password"
          required
          type="password"
        />
        <button type="submit">Login</button>
      </form>

      <div id="message" style="color: red; margin-top: 10px"></div>
    </div>
  </body>
</html>
