# Local Docker Compose profile.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/overlookhoteldb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.thymeleaf.cache=false
spring.devtools.restart.enabled=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
spring.cache.type=redis

spring.security.user.name=${SPRING_SECURITY_USER_NAME:dev}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:dev-password}

app.seed.enabled=${APP_SEED_ENABLED:true}
app.jwt.secret=${APP_JWT_SECRET:local_docker_jwt_secret_with_32_chars_min}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.web=INFO
logging.level.master.master=INFO
logging.level.root=INFO
